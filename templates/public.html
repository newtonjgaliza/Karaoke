<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Pedido - Karaoke do Attilas</title>
    <!-- Google Fonts: Outfit for clean interface, DotGothic16 for the retro dot-matrix font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <!-- Logo and Header -->
        <header class="header">
            <div class="logo-wrapper">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo Karaoke do Attilas" class="logo">
            </div>
            <h1 class="neon-title">KARAOKE DO ATTILAS</h1>
            <p class="subtitle">Escolha sua música e prepare a garganta!</p>
        </header>

        <!-- Form Card -->
        <main class="form-card">
            <form id="requestForm" autocomplete="off">
                <!-- Nome -->
                <div class="input-group">
                    <label for="name">Seu Nome</label>
                    <div class="input-wrapper">
                        <input type="text" id="name" name="name" required placeholder="ex. joao">
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Música -->
                <div class="input-group">
                    <label for="song">Nome da Música</label>
                    <div class="input-wrapper">
                        <input type="text" id="song" name="song" required placeholder="ex: saint seiya">
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Referência -->
                <div class="input-group">
                    <label for="reference">Referência (Cantor/Anime/Filme)</label>
                    <div class="input-wrapper">
                        <input type="text" id="reference" name="reference" placeholder="ex: cavaleiros do zodiaco">
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Informações Extras -->
                <div class="input-group">
                    <label for="extra_info">Informações Extras</label>
                    <div class="input-wrapper">
                        <input type="text" id="extra_info" name="extra_info" placeholder="ex: versão do anime">
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Button -->
                <button type="submit" id="submitBtn" class="btn-submit">
                    <span class="btn-text">Enviar Pedido</span>
                    <span class="btn-glow"></span>
                </button>
            </form>
        </main>
        
        <footer class="footer">
            <p>Newton Galiza. Todos os direitos reservados</p>
        </footer>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">🎶</div>
            <h2>Pedido Enviado!</h2>
            <p>Sua música foi adicionada à fila. Fique atento ao painel para saber quando cantar!</p>
            <button class="btn-modal-close" onclick="closeModal()">OK, quero outra!</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/public.js') }}"></script>
</body>
</html>
